<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found | ATRIndustries</title>
<style>
  @font-face { font-family: 'Schibsted Grotesk'; font-weight: 400 900; font-display: swap; src: url(/assets/fonts/schibsted-grotesk-normal-400-900.woff2) format('woff2'); }
  :root { --green: #0f4c45; --ground: #e6e7e9; --ink: #141414; --muted: #64686e; --flash: #f4c430; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: grid; place-items: center; padding: 24px 16px; background: var(--ground); color: var(--ink); font: 17px/1.6 "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif; }
  .chip { position: relative; width: min(320px, 100%); min-height: 460px; display: flex; flex-direction: column; background: #fff; border-radius: 6px; padding: 28px 24px 30px 24px; box-shadow: 0 2px 4px rgb(20 32 40 / 0.12), 0 22px 40px -20px rgb(20 32 40 / 0.42); }
  .blank { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 22px; }
  .blank i { border: 1.5px dashed rgb(20 20 20 / 0.22); border-radius: 4px; }
  b { display: block; font-size: 1.6rem; font-weight: 900; letter-spacing: -0.03em; line-height: 1; }
  h1 { font-size: 1.15rem; font-weight: 800; margin: 8px 0 6px; letter-spacing: -0.01em; }
  p { margin: 0 0 18px; color: var(--muted); }
  a.btn { align-self: flex-start; padding: 0.8em 1.2em; border-radius: 6px; background: var(--flash); color: var(--ink); font-weight: 700; text-decoration: none; box-shadow: inset 0 -2px 0 rgb(0 0 0 / 0.14); }
  a:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
</style>
</head>
<body>
<main class="chip">
  <div class="blank" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <b>No. 404</b>
  <h1>This chip isn't in the deck.</h1>
  <p>The link may be old or mistyped.</p>
  <a class="btn" href="/">Back to the deck</a>
</main>
</body>
</html>
